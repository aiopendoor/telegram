name: Telegram History Sync (One-time)

on:
  workflow_dispatch:  # 수동 실행 전용

jobs:
  sync-history:
    permissions:
      contents: write  # 체크포인트 파일 업데이트를 위해 쓰기 권한 필요
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon python-dotenv

      - name: Run History Sync Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        working-directory: 10_Collector_Agents/10_Telegram
        run: python sync_history.py

      - name: Commit and Push Checkpoints
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 10_Collector_Agents/10_Telegram/last_processed_ids.json
          git commit -m "chore: update history sync checkpoints [skip ci]" || echo "No changes to commit"
          git push

