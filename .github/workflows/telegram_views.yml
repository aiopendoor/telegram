name: "[Daily] Telegram Views Tracker"

on:
  schedule:
    - cron: '55 14 * * *'  # 매일 한국시간 23:55 (UTC 14:55) 실행
  workflow_dispatch:       # 수동 실행 가능

concurrency:
  group: telegram-views
  cancel-in-progress: true

jobs:
  track-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon python-dotenv supabase google-generativeai

      - name: Run Views Tracker Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SESSION_REALTIME: ${{ secrets.TELEGRAM_SESSION_REALTIME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: 10_Collector_Agents/10_Telegram
        run: python track_views_top30.py
